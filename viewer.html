<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chub Card Viewer</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #111318;
      --panel: #191d26;
      --panel-2: #202634;
      --text: #eceff6;
      --muted: #9aa4b6;
      --line: #30384b;
      --accent: #82aaff;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: radial-gradient(circle at top left, #1f2942 0, #111318 34rem);
      color: var(--text);
      font: 15px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    /* ── header ── */
    header {
      position: sticky; top: 0; z-index: 5;
      padding: 1rem;
      background: rgba(17,19,24,.92);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(12px);
    }
    h1 { margin: 0 0 .65rem; font-size: clamp(1.25rem, 4vw, 2rem); }
    .controls { display: grid; grid-template-columns: minmax(0,1fr) auto auto; gap: .65rem; }
    input, select, button, a.button {
      border: 1px solid var(--line); border-radius: .75rem;
      background: var(--panel-2); color: var(--text);
      padding: .75rem .9rem; text-decoration: none; cursor: pointer;
    }
    input { width: 100%; cursor: text; }
    button:hover, a.button:hover { border-color: var(--accent); }
    .status { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .65rem; color: var(--muted); font-size: .9rem; }
    .pill { border: 1px solid var(--line); border-radius: 999px; padding: .2rem .55rem; background: rgba(32,38,52,.7); }
    .notice { color: var(--muted); margin-top: .55rem; max-width: 85rem; font-size: .88rem; }

    /* ── grid ── */
    main { padding: 1rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px,1fr)); gap: 1rem; align-items: stretch; }
    .card { overflow: hidden; border: 1px solid var(--line); border-radius: 1rem; background: rgba(25,29,38,.92); box-shadow: 0 12px 40px rgba(0,0,0,.22); }
    .thumb {
      display: block; width: 100%; aspect-ratio: 2/3; object-fit: cover;
      background: linear-gradient(135deg,#242b3c,#151923);
      cursor: pointer;
    }
    .thumb:hover { opacity: .85; }
    .body { padding: .85rem; }
    .name { font-weight: 750; overflow-wrap: anywhere; }
    .meta { color: var(--muted); font-size: .88rem; overflow-wrap: anywhere; margin-top: .2rem; }
    .tags { display: flex; flex-wrap: wrap; gap: .25rem; margin-top: .55rem; }
    .tag { color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: .1rem .4rem; font-size: .75rem; }
    .actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: .45rem; margin-top: .75rem; }
    .actions .wide { grid-column: 1 / -1; }
    .actions button, .actions a { text-align: center; font-size: .82rem; padding: .5rem .3rem; }

    .load { display: flex; justify-content: center; padding: 1.25rem; }
    .empty { padding: 2rem; color: var(--muted); text-align: center; }

    /* ── card detail dialog ── */
    dialog {
      width: min(1000px, calc(100vw - 1.5rem));
      max-height: min(860px, calc(100vh - 1.5rem));
      border: 1px solid var(--line); border-radius: 1.25rem;
      background: var(--panel); color: var(--text);
      padding: 0; overflow: hidden;
    }
    dialog[open] { display: flex; flex-direction: column; }
    dialog::backdrop { background: rgba(0,0,0,.72); }

    .cd-layout {
      display: grid;
      grid-template-columns: 200px 1fr;
      flex: 1; min-height: 0;
      overflow: hidden;
    }

    /* sidebar */
    .cd-side {
      border-right: 1px solid var(--line);
      display: flex; flex-direction: column;
      overflow-y: auto;
    }
    .cd-avatar {
      width: 100%; aspect-ratio: 2/3; object-fit: cover;
      background: linear-gradient(135deg,#242b3c,#151923);
      flex-shrink: 0;
    }
    .cd-dl {
      display: flex; flex-direction: column; gap: .5rem;
      padding: .75rem;
    }
    .cd-dl a {
      display: block; text-align: center; font-size: .82rem;
      padding: .5rem; border: 1px solid var(--line);
      border-radius: .6rem; background: var(--panel-2);
      color: var(--text); text-decoration: none; cursor: pointer;
    }
    .cd-dl a:hover { border-color: var(--accent); }

    /* main panel */
    .cd-main { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }

    .cd-head {
      display: flex; justify-content: space-between; align-items: flex-start;
      gap: 1rem; padding: 1rem 1rem .75rem;
      border-bottom: 1px solid var(--line); flex-shrink: 0;
    }
    .cd-name { font-size: 1.2rem; font-weight: 750; overflow-wrap: anywhere; }
    .cd-creator { color: var(--muted); font-size: .9rem; margin-top: .2rem; }
    .cd-tags { display: flex; flex-wrap: wrap; gap: .25rem; margin-top: .5rem; }

    .cd-close {
      flex-shrink: 0; padding: .35rem .7rem;
      border: 1px solid var(--line); border-radius: .6rem;
      background: var(--panel-2); color: var(--muted);
      cursor: pointer; font-size: 1rem; line-height: 1;
    }
    .cd-close:hover { border-color: var(--accent); color: var(--text); }

    /* tabs */
    .cd-tabs {
      display: flex; flex-wrap: wrap; gap: .3rem;
      padding: .6rem 1rem;
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
    }
    .cd-tab {
      padding: .3rem .75rem; font-size: .82rem;
      border: 1px solid var(--line); border-radius: 999px;
      background: transparent; color: var(--muted);
      cursor: pointer;
    }
    .cd-tab:hover { color: var(--text); border-color: var(--accent); }
    .cd-tab.active { background: var(--accent); color: #111318; border-color: var(--accent); font-weight: 600; }

    /* scrollable content */
    .cd-body {
      flex: 1; overflow-y: auto;
      padding: 1rem;
    }
    .cd-section { display: none; }
    .cd-section.active { display: block; }
    .cd-field {
      white-space: pre-wrap; word-break: break-word; line-height: 1.6;
      color: var(--text); font-size: .93rem;
    }
    .cd-field-empty { color: var(--muted); font-style: italic; }
    .cd-alt-greeting {
      border: 1px solid var(--line); border-radius: .6rem;
      padding: .75rem; margin-bottom: .75rem; background: var(--panel-2);
    }
    .cd-alt-label { color: var(--accent); font-size: .78rem; font-weight: 600; margin-bottom: .4rem; }
    .cd-raw { white-space: pre-wrap; word-break: break-word; color: #d6deff; font: 13px/1.5 monospace; }

    @media (max-width: 680px) {
      .controls { grid-template-columns: 1fr; }
      main, header { padding: .75rem; }
      .cd-layout { grid-template-columns: 1fr; }
      .cd-side { flex-direction: row; border-right: none; border-bottom: 1px solid var(--line); }
      .cd-avatar { width: 120px; aspect-ratio: 2/3; flex-shrink: 0; }
      .cd-dl { flex-direction: row; flex-wrap: wrap; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Chub Card Viewer</h1>
    <div class="controls">
      <input id="search" type="search" placeholder="Search by name, creator, or tag" autocomplete="off">
      <select id="limit" aria-label="Cards per page">
        <option value="24">24</option>
        <option value="40" selected>40</option>
        <option value="80">80</option>
      </select>
      <button id="refresh">Refresh</button>
    </div>
    <div id="status" class="status"></div>
    <div class="notice">Remote PNGs are lazy-loaded from avatars.charhub.io and are not mirrored locally. The local cache stores metadata only.</div>
  </header>
  <main>
    <section id="grid" class="grid" aria-live="polite"></section>
    <div id="empty" class="empty" hidden>No cards match the current search yet. If indexing is still running, wait a moment and try Load more.</div>
    <div class="load"><button id="more">Load more</button></div>
  </main>

  <dialog id="cardDialog">
    <div class="cd-layout">
      <div class="cd-side">
        <img id="cdAvatar" class="cd-avatar" referrerpolicy="no-referrer" alt="">
        <div class="cd-dl">
          <a id="cdDlPng"  href="#" target="_blank" rel="noreferrer">Download PNG</a>
          <a id="cdDlJson" href="#">Download JSON</a>
          <a id="cdRemote" href="#" target="_blank" rel="noreferrer">Open PNG (remote)</a>
        </div>
      </div>
      <div class="cd-main">
        <div class="cd-head">
          <div>
            <div class="cd-name" id="cdName"></div>
            <div class="cd-creator" id="cdCreator"></div>
            <div class="cd-tags" id="cdTags"></div>
          </div>
          <button class="cd-close" id="cdClose">✕</button>
        </div>
        <div class="cd-tabs" id="cdTabs"></div>
        <div class="cd-body" id="cdBody"></div>
      </div>
    </div>
  </dialog>

  <script>
    const grid      = document.querySelector('#grid');
    const empty     = document.querySelector('#empty');
    const statusEl  = document.querySelector('#status');
    const search    = document.querySelector('#search');
    const limit     = document.querySelector('#limit');
    const more      = document.querySelector('#more');
    const cardDialog = document.querySelector('#cardDialog');

    let offset = 0;
    let total  = 0;
    let pendingTimer = 0;

    function esc(value) {
      return String(value ?? '').replace(/[&<>"]/g, (ch) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
    }
    function apiUrl(path, params = {}) {
      const url = new URL(path, location.origin);
      for (const [k, v] of Object.entries(params)) url.searchParams.set(k, v);
      return url.toString();
    }

    /* ── status bar ── */
    function renderStatus(status) {
      const values = [
        status.message,
        `${Number(status.cards || 0).toLocaleString()} cards loaded`,
        `${Number(status.scanned || 0).toLocaleString()} scanned`,
        `${Number(status.errors || 0).toLocaleString()} errors`,
      ];
      statusEl.innerHTML = values.map((v) => `<span class="pill">${esc(v)}</span>`).join('');
    }

    /* ── card tile ── */
    function renderCard(card) {
      const tags     = (card.tags || []).slice(0, 6).map((t) => `<span class="tag">${esc(t)}</span>`).join('');
      const jsonPath = encodeURIComponent(card.jsonPath);
      const article  = document.createElement('article');
      article.className = 'card';
      article.innerHTML = `
        <img class="thumb" loading="lazy" referrerpolicy="no-referrer" alt="" src="${esc(card.avatar || '')}">
        <div class="body">
          <div class="name">${esc(card.name)}</div>
          <div class="meta">${esc(card.creator || card.fullPath || card.jsonPath)}</div>
          <div class="tags">${tags}</div>
          <div class="actions">
            <a class="button" href="/download/png?path=${jsonPath}"  target="_blank" rel="noreferrer">PNG</a>
            <a class="button" href="/download/json?path=${jsonPath}">JSON</a>
            <button class="button" data-open>Open</button>
          </div>
        </div>`;
      article.querySelector('img').addEventListener('error', (e) => e.currentTarget.removeAttribute('src'));
      const openCard = () => showCard(card);
      article.querySelector('img').addEventListener('click', openCard);
      article.querySelector('[data-open]').addEventListener('click', openCard);
      return article;
    }

    /* ── card detail dialog ── */
    const FIELDS = [
      { key: 'description',               label: 'Description' },
      { key: 'first_mes',                  label: 'First Message' },
      { key: 'personality',               label: 'Personality' },
      { key: 'scenario',                  label: 'Scenario' },
      { key: 'creator_notes',             label: 'Creator Notes' },
      { key: 'system_prompt',             label: 'System Prompt' },
      { key: 'post_history_instructions', label: 'Post History' },
      { key: 'alternate_greetings',       label: 'Alt. Greetings' },
    ];

    function hasContent(value) {
      if (Array.isArray(value)) return value.some((v) => String(v || '').trim());
      return String(value || '').trim().length > 0;
    }

    function buildSection(key, value) {
      const div = document.createElement('div');
      div.className = 'cd-section';
      div.dataset.key = key;

      if (key === 'alternate_greetings') {
        const arr = Array.isArray(value) ? value : [];
        if (!arr.length) {
          div.innerHTML = `<span class="cd-field-empty">No alternate greetings.</span>`;
        } else {
          div.innerHTML = arr.map((g, i) => `
            <div class="cd-alt-greeting">
              <div class="cd-alt-label">Greeting ${i + 1}</div>
              <div class="cd-field">${esc(g)}</div>
            </div>`).join('');
        }
      } else {
        const text = String(value || '').trim();
        div.innerHTML = text
          ? `<div class="cd-field">${esc(text)}</div>`
          : `<span class="cd-field-empty">No content.</span>`;
      }
      return div;
    }

    function buildRawSection(parsed) {
      const div = document.createElement('div');
      div.className = 'cd-section';
      div.dataset.key = '__raw';
      const pre = document.createElement('pre');
      pre.className = 'cd-raw';
      pre.textContent = JSON.stringify(parsed, null, 2);
      div.appendChild(pre);
      return div;
    }

    async function showCard(card) {
      const jsonPath = encodeURIComponent(card.jsonPath);

      /* populate static parts immediately */
      document.querySelector('#cdName').textContent    = card.name || '(unnamed)';
      document.querySelector('#cdCreator').textContent = card.creator || card.fullPath || '';
      document.querySelector('#cdTags').innerHTML      = (card.tags || []).map((t) => `<span class="tag">${esc(t)}</span>`).join('');
      document.querySelector('#cdAvatar').src          = card.avatar || '';
      document.querySelector('#cdDlPng').href          = `/download/png?path=${jsonPath}`;
      document.querySelector('#cdDlJson').href         = `/download/json?path=${jsonPath}`;
      document.querySelector('#cdRemote').href         = card.avatar || '#';
      if (!card.avatar) document.querySelector('#cdRemote').style.display = 'none';
      else document.querySelector('#cdRemote').style.display = '';

      /* clear tabs + body, show placeholder */
      const tabsEl = document.querySelector('#cdTabs');
      const bodyEl = document.querySelector('#cdBody');
      tabsEl.innerHTML = '';
      bodyEl.innerHTML = '<span class="cd-field-empty">Loading…</span>';

      cardDialog.showModal();

      const resp = await fetch(apiUrl('/api/card', { path: card.jsonPath }));
      const json = await resp.json();
      const data = json.card?.data || {};

      /* build tabs only for fields that have content, plus raw */
      const available = FIELDS.filter((f) => hasContent(data[f.key]));
      available.push({ key: '__raw', label: 'Raw JSON' });

      tabsEl.innerHTML = '';
      bodyEl.innerHTML = '';

      available.forEach(({ key, label }, i) => {
        const tab = document.createElement('button');
        tab.className = 'cd-tab' + (i === 0 ? ' active' : '');
        tab.textContent = label;
        tab.dataset.key = key;
        tab.addEventListener('click', () => switchTab(key));
        tabsEl.appendChild(tab);

        const section = (key === '__raw')
          ? buildRawSection(json.card)
          : buildSection(key, data[key]);
        if (i === 0) section.classList.add('active');
        bodyEl.appendChild(section);
      });

      if (!available.length) {
        bodyEl.innerHTML = '<span class="cd-field-empty">No content found.</span>';
      }
    }

    function switchTab(key) {
      const tabsEl = document.querySelector('#cdTabs');
      const bodyEl = document.querySelector('#cdBody');
      tabsEl.querySelectorAll('.cd-tab').forEach((t) => t.classList.toggle('active', t.dataset.key === key));
      bodyEl.querySelectorAll('.cd-section').forEach((s) => s.classList.toggle('active', s.dataset.key === key));
      bodyEl.scrollTop = 0;
    }

    document.querySelector('#cdClose').addEventListener('click', () => cardDialog.close());
    cardDialog.addEventListener('click', (e) => { if (e.target === cardDialog) cardDialog.close(); });

    /* ── pagination ── */
    async function loadCards(reset = false) {
      if (reset) { offset = 0; grid.innerHTML = ''; }
      const data = await fetch(apiUrl('/api/cards', { q: search.value, offset, limit: limit.value })).then((r) => r.json());
      renderStatus(data.status);
      total = data.total;
      for (const card of data.items) grid.append(renderCard(card));
      offset += data.items.length;
      empty.hidden = grid.children.length !== 0;
      more.hidden   = offset >= total && !data.status.indexing;
      more.disabled = data.items.length === 0 && data.status.indexing;
      more.textContent = more.disabled ? 'Indexing…' : 'Load more';
    }

    async function refreshStatus() {
      const data = await fetch('/api/status').then((r) => r.json());
      renderStatus(data);
      if (data.indexing) {
        more.hidden   = false;
        more.disabled = false;
        more.textContent = 'Load more';
      }
    }

    function queueSearch() {
      clearTimeout(pendingTimer);
      pendingTimer = setTimeout(() => loadCards(true), 250);
    }

    document.querySelector('#refresh').addEventListener('click', () => loadCards(true));
    search.addEventListener('input', queueSearch);
    limit.addEventListener('change', () => loadCards(true));
    more.addEventListener('click', () => loadCards(false));

    loadCards(true);
    setInterval(refreshStatus, 2500);
  </script>
</body>
</html>
